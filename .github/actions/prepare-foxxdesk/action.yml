name: Validate FoxxDesk source
description: Validate the committed FoxxDesk public brand, runtime defaults, icon cache and compatible hbb_common without mutating upstream workflows or source
runs:
  using: composite
  steps:
    - name: Validate committed FoxxDesk source
      shell: bash
      run: |
        set -euo pipefail
        if command -v python3 >/dev/null 2>&1; then
          PYTHON_BIN=python3
        else
          PYTHON_BIN=python
        fi
        "$PYTHON_BIN" scripts/foxxdesk_validate.py --target . --ci
