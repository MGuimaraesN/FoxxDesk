name: Prepare FoxxDesk source
description: Restore the persistent FoxxDesk overlay and pin hbb_common before a build
runs:
  using: composite
  steps:
    - name: Prepare brand, icons and compatible dependency
      shell: bash
      run: |
        set -euo pipefail
        if command -v python3 >/dev/null 2>&1; then
          PYTHON_BIN=python3
        else
          PYTHON_BIN=python
        fi
        "$PYTHON_BIN" scripts/foxxdesk_prepare.py --target . --ci --apply --yes
