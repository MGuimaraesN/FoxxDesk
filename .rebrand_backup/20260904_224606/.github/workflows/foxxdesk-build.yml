name: FoxxDesk Build

on:
  # Manual only by design. Build starts only from Actions > FoxxDesk Build > Run workflow.
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload build artifacts"
        required: true
        type: boolean
        default: true
      upload_tag:
        description: "Release tag used for prerelease upload"
        required: true
        type: string
        default: "foxxdesk-nightly"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: FoxxDesk preflight
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Prepare and validate FoxxDesk source
        uses: ./.github/actions/prepare-foxxdesk

  build:
    name: FoxxDesk reusable Flutter build
    needs: preflight
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: ${{ inputs.upload_artifact }}
      upload-tag: ${{ inputs.upload_tag }}
